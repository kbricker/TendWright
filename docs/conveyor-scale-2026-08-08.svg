<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1300" width="1400" height="1300" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="1400" height="1300" fill="#faf9f6"/>

  <text x="40" y="46" font-size="30" font-weight="700" fill="#1a1a1a">How big is this thing, actually</text>
  <text x="40" y="72" font-size="16" fill="#666">Everything on this sheet is drawn to scale against everything else. Plan #835 / #840.</text>
  <line x1="40" y1="84" x2="1360" y2="84" stroke="#d8d5cc" stroke-width="2"/>

  <!-- ================= PANEL 1 ================= -->
  <rect x="40" y="98" width="1320" height="602" rx="8" fill="#ffffff" stroke="#ddd9d0" stroke-width="1.5"/>
  <text x="62" y="132" font-size="21" font-weight="600" fill="#1a1a1a">1 · What 37 mm is — belt width, seen from above</text>
  <text x="62" y="156" font-size="14.5" fill="#777">Top view. The belt is the grey strip; the things sitting on it are drawn at the same scale.</text>

  <!-- --- 37mm belt --- -->
  <text x="90" y="238" font-size="16" font-weight="700" fill="#1a1a1a">37 mm track — the prior-art size</text>
  <rect x="90" y="250" width="560" height="111" fill="#dedbd2" stroke="#1a1a1a" stroke-width="2.5"/>
  <g stroke="#b3afa3" stroke-width="1.1">
    <line x1="110" y1="252" x2="110" y2="359"/><line x1="130" y1="252" x2="130" y2="359"/>
    <line x1="150" y1="252" x2="150" y2="359"/><line x1="170" y1="252" x2="170" y2="359"/>
    <line x1="190" y1="252" x2="190" y2="359"/><line x1="210" y1="252" x2="210" y2="359"/>
    <line x1="230" y1="252" x2="230" y2="359"/><line x1="250" y1="252" x2="250" y2="359"/>
    <line x1="270" y1="252" x2="270" y2="359"/><line x1="290" y1="252" x2="290" y2="359"/>
    <line x1="310" y1="252" x2="310" y2="359"/><line x1="330" y1="252" x2="330" y2="359"/>
    <line x1="350" y1="252" x2="350" y2="359"/><line x1="370" y1="252" x2="370" y2="359"/>
    <line x1="390" y1="252" x2="390" y2="359"/><line x1="410" y1="252" x2="410" y2="359"/>
    <line x1="430" y1="252" x2="430" y2="359"/><line x1="450" y1="252" x2="450" y2="359"/>
    <line x1="470" y1="252" x2="470" y2="359"/><line x1="490" y1="252" x2="490" y2="359"/>
    <line x1="510" y1="252" x2="510" y2="359"/><line x1="530" y1="252" x2="530" y2="359"/>
    <line x1="550" y1="252" x2="550" y2="359"/><line x1="570" y1="252" x2="570" y2="359"/>
    <line x1="590" y1="252" x2="590" y2="359"/><line x1="610" y1="252" x2="610" y2="359"/>
    <line x1="630" y1="252" x2="630" y2="359"/>
  </g>
  <!-- blank overhanging -->
  <rect x="140" y="245" width="120" height="120" fill="#c8452b" fill-opacity="0.9" stroke="#8e2f1d" stroke-width="2"/>
  <line x1="128" y1="245" x2="278" y2="245" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="128" y1="365" x2="278" y2="365" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="200" y="393" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">our blank overhangs ~1.5 mm each side</text>
  <!-- other objects -->
  <circle cx="390" cy="305" r="36.5" fill="#d9c26a" stroke="#8a7328" stroke-width="2"/>
  <rect x="440" y="282" width="95" height="47" rx="3" fill="#c94a4a" stroke="#7d2c2c" stroke-width="2"/>
  <g fill="#e07070"><circle cx="452" cy="294" r="6"/><circle cx="475" cy="294" r="6"/><circle cx="498" cy="294" r="6"/><circle cx="521" cy="294" r="6"/></g>
  <rect x="555" y="260" width="90" height="90" fill="#7a9bbd" stroke="#3e5c78" stroke-width="2"/>
  <text x="600" y="311" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">30 mm</text>

  <!-- --- 60mm belt --- -->
  <text x="740" y="238" font-size="16" font-weight="700" fill="#1a1a1a">60 mm track — what a 40 mm blank needs</text>
  <rect x="740" y="250" width="560" height="180" fill="#dedbd2" stroke="#1a1a1a" stroke-width="2.5"/>
  <g stroke="#b3afa3" stroke-width="1.1">
    <line x1="760" y1="252" x2="760" y2="428"/><line x1="780" y1="252" x2="780" y2="428"/>
    <line x1="800" y1="252" x2="800" y2="428"/><line x1="820" y1="252" x2="820" y2="428"/>
    <line x1="840" y1="252" x2="840" y2="428"/><line x1="860" y1="252" x2="860" y2="428"/>
    <line x1="880" y1="252" x2="880" y2="428"/><line x1="900" y1="252" x2="900" y2="428"/>
    <line x1="920" y1="252" x2="920" y2="428"/><line x1="940" y1="252" x2="940" y2="428"/>
    <line x1="960" y1="252" x2="960" y2="428"/><line x1="980" y1="252" x2="980" y2="428"/>
    <line x1="1000" y1="252" x2="1000" y2="428"/><line x1="1020" y1="252" x2="1020" y2="428"/>
    <line x1="1040" y1="252" x2="1040" y2="428"/><line x1="1060" y1="252" x2="1060" y2="428"/>
    <line x1="1080" y1="252" x2="1080" y2="428"/><line x1="1100" y1="252" x2="1100" y2="428"/>
    <line x1="1120" y1="252" x2="1120" y2="428"/><line x1="1140" y1="252" x2="1140" y2="428"/>
    <line x1="1160" y1="252" x2="1160" y2="428"/><line x1="1180" y1="252" x2="1180" y2="428"/>
    <line x1="1200" y1="252" x2="1200" y2="428"/><line x1="1220" y1="252" x2="1220" y2="428"/>
    <line x1="1240" y1="252" x2="1240" y2="428"/><line x1="1260" y1="252" x2="1260" y2="428"/>
    <line x1="1280" y1="252" x2="1280" y2="428"/>
  </g>
  <rect x="790" y="280" width="120" height="120" fill="#c8452b" fill-opacity="0.9" stroke="#8e2f1d" stroke-width="2"/>
  <line x1="778" y1="250" x2="778" y2="280" stroke="#2e7d32" stroke-width="2.5"/>
  <line x1="778" y1="400" x2="778" y2="430" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="850" y="455" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700">10 mm of belt clear on each side</text>
  <circle cx="1000" cy="340" r="36.5" fill="#d9c26a" stroke="#8a7328" stroke-width="2"/>
  <rect x="1060" y="317" width="95" height="47" rx="3" fill="#c94a4a" stroke="#7d2c2c" stroke-width="2"/>
  <g fill="#e07070"><circle cx="1072" cy="329" r="6"/><circle cx="1095" cy="329" r="6"/><circle cx="1118" cy="329" r="6"/><circle cx="1141" cy="329" r="6"/></g>
  <rect x="1180" y="295" width="90" height="90" fill="#7a9bbd" stroke="#3e5c78" stroke-width="2"/>
  <text x="1225" y="346" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">30 mm</text>

  <!-- --- reference objects --- -->
  <line x1="62" y1="478" x2="1338" y2="478" stroke="#e5e1d8" stroke-width="1.5"/>
  <text x="90" y="504" font-size="16" font-weight="700" fill="#1a1a1a">Same scale — things you can pick up right now</text>

  <rect x="90" y="518" width="257" height="162" rx="10" fill="#4a5c6e" stroke="#2c3846" stroke-width="2"/>
  <rect x="108" y="558" width="46" height="34" rx="4" fill="#d9c26a"/>
  <text x="218" y="694" font-size="13.5" fill="#666" text-anchor="middle">credit card · 86 × 54</text>

  <rect x="392" y="518" width="153" height="63" rx="5" fill="#2e7d4f" stroke="#1c4d31" stroke-width="2"/>
  <rect x="480" y="530" width="34" height="26" rx="2" fill="#c9c9c9"/>
  <text x="468" y="600" font-size="13.5" fill="#666" text-anchor="middle">Pico · 51 × 21</text>

  <rect x="392" y="624" width="152" height="44" rx="8" fill="#8a8f96" stroke="#5a5f66" stroke-width="2"/>
  <rect x="544" y="636" width="9" height="20" rx="2" fill="#5a5f66"/>
  <text x="470" y="694" font-size="13.5" fill="#666" text-anchor="middle">AA battery · 50 × 14.5</text>

  <circle cx="640" cy="554" r="36.5" fill="#d9c26a" stroke="#8a7328" stroke-width="2"/>
  <text x="640" y="614" font-size="13.5" fill="#666" text-anchor="middle">quarter · Ø24</text>

  <rect x="600" y="638" width="95" height="47" rx="3" fill="#c94a4a" stroke="#7d2c2c" stroke-width="2"/>
  <g fill="#e07070"><circle cx="612" cy="650" r="6"/><circle cx="635" cy="650" r="6"/><circle cx="658" cy="650" r="6"/><circle cx="681" cy="650" r="6"/></g>
  <text x="648" y="697" font-size="13.5" fill="#666" text-anchor="middle">2×4 brick · 32 × 16</text>

  <rect x="745" y="518" width="120" height="120" fill="#c8452b" stroke="#8e2f1d" stroke-width="2"/>
  <text x="805" y="660" font-size="13.5" fill="#666" text-anchor="middle">our blank · 40 × 40</text>

  <g font-size="15.5" fill="#333">
    <text x="920" y="546" font-weight="700">So: 37 mm is about a Lego 2×4 laid across.</text>
    <text x="920" y="570">A quarter is 24 mm. An AA is 14.5 mm thick.</text>
    <text x="920" y="606" font-weight="700" fill="#c0392b">Our 40 mm blank does not fit a 37 mm belt.</text>
    <text x="920" y="630">It overhangs — which is exactly when a part tips</text>
    <text x="920" y="654">over as it crosses a gap between two modules.</text>
    <text x="920" y="684" fill="#777">That is the whole reason width is a live question.</text>
  </g>

  <!-- ================= PANEL 2 ================= -->
  <rect x="40" y="720" width="650" height="540" rx="8" fill="#ffffff" stroke="#ddd9d0" stroke-width="1.5"/>
  <text x="62" y="754" font-size="21" font-weight="600" fill="#1a1a1a">2 · The v1 loop at 37 mm</text>
  <text x="62" y="778" font-size="14.5" fill="#777">grey = a sheet of A4, for size. Different scale from panel 1.</text>

  <rect x="150" y="806" width="252" height="356" rx="3" fill="#efece3" stroke="#c9c5ba" stroke-width="2"/>
  <text x="276" y="1146" font-size="13" fill="#a8a49a" text-anchor="middle">A4 · 210 × 297</text>

  <g fill="#dedbd2" stroke="#1a1a1a" stroke-width="2">
    <rect x="156" y="864" width="60" height="60"/>
    <rect x="336" y="864" width="60" height="60"/>
    <rect x="156" y="1044" width="60" height="60"/>
    <rect x="336" y="1044" width="60" height="60"/>
    <rect x="219" y="864" width="114" height="60"/>
    <rect x="219" y="1044" width="114" height="60"/>
    <rect x="156" y="927" width="60" height="114"/>
    <rect x="336" y="927" width="60" height="114"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="2.5" fill="none">
    <line x1="245" y1="894" x2="308" y2="894" marker-end="url(#a)"/>
    <line x1="366" y1="958" x2="366" y2="1012" marker-end="url(#a)"/>
    <line x1="308" y1="1074" x2="245" y2="1074" marker-end="url(#a)"/>
    <line x1="186" y1="1012" x2="186" y2="958" marker-end="url(#a)"/>
  </g>

  <g font-size="15" fill="#333">
    <text x="440" y="880" font-weight="700">~200 × 200 mm</text>
    <text x="440" y="904">Sits on a sheet of paper.</text>
    <text x="440" y="946" font-weight="700" fill="#2e7d32">Carries: dice, M3 hardware,</text>
    <text x="440" y="968" font-weight="700" fill="#2e7d32">marbles, Lego, small parts.</text>
    <text x="440" y="1010" fill="#c0392b" font-weight="700">Will NOT carry the 40 mm</text>
    <text x="440" y="1032" fill="#c0392b" font-weight="700">blank properly.</text>
    <text x="440" y="1074" fill="#777">~1.2 m of chain to print</text>
    <text x="440" y="1096" fill="#777">across all 8 modules.</text>
  </g>

  <!-- ================= PANEL 3 ================= -->
  <rect x="710" y="720" width="650" height="540" rx="8" fill="#ffffff" stroke="#ddd9d0" stroke-width="1.5"/>
  <text x="732" y="754" font-size="21" font-weight="600" fill="#1a1a1a">3 · The v1 loop at 60 mm</text>
  <text x="732" y="778" font-size="14.5" fill="#777">same scale as panel 2 — this is the honest cost of the blank</text>

  <rect x="900" y="806" width="252" height="356" rx="3" fill="#efece3" stroke="#c9c5ba" stroke-width="2"/>

  <g fill="#dedbd2" stroke="#1a1a1a" stroke-width="2">
    <rect x="845" y="803" width="91" height="91"/>
    <rect x="1116" y="803" width="91" height="91"/>
    <rect x="845" y="1074" width="91" height="91"/>
    <rect x="1116" y="1074" width="91" height="91"/>
    <rect x="939" y="803" width="174" height="91"/>
    <rect x="939" y="1074" width="174" height="91"/>
    <rect x="845" y="897" width="91" height="174"/>
    <rect x="1116" y="897" width="91" height="174"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="2.5" fill="none">
    <line x1="975" y1="848" x2="1078" y2="848" marker-end="url(#a)"/>
    <line x1="1161" y1="945" x2="1161" y2="1024" marker-end="url(#a)"/>
    <line x1="1078" y1="1120" x2="975" y2="1120" marker-end="url(#a)"/>
    <line x1="891" y1="1024" x2="891" y2="945" marker-end="url(#a)"/>
  </g>
  <text x="1026" y="1196" font-size="13" fill="#a8a49a" text-anchor="middle">A4 underneath, for comparison</text>

  <g font-size="15" fill="#333">
    <text x="732" y="1232" font-weight="700">~300 × 300 mm — overhangs an A4 sheet on every side.</text>
  </g>
  <g font-size="15" fill="#333">
    <text x="1226" y="850" font-weight="700">~2.4×</text>
    <text x="1226" y="872">the belt</text>
    <text x="1226" y="894">material and</text>
    <text x="1226" y="916">print time of</text>
    <text x="1226" y="938">the 37 mm</text>
    <text x="1226" y="960">version.</text>
    <text x="1226" y="1000" fill="#777">~1.8 m of</text>
    <text x="1226" y="1022" fill="#777">chain, at</text>
    <text x="1226" y="1044" fill="#777">60 mm wide.</text>
  </g>
</svg>
