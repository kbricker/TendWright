[project]
name = "tendwright"
version = "0.1.0"
description = "Robotic CNC machine-tending cell — Python learning project (sim-first prototype ladder P0-P6)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.11",
    "mink>=1.2",
    "numpy>=2.0",
    "feetech-servo-sdk>=1.0.0",
    "pyserial>=3.5",
    "opencv-python>=5.0.0.93",
    "pupil-apriltags>=1.0.4.post11",
]

# Not a distributable package: the repo is run in place (`uv run python -m
# sim.<entry>` from the repo root), so nothing is installed into
# site-packages and the generic top-level package names (sim, mes, ...)
# can't collide with anything.
[tool.uv]
package = false
